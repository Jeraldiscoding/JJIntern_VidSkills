<!doctype html><html><head><meta charset="utf-8"><title>JJIntern — revision 07 / acceleration</title><style>html,body{margin:0;background:#edf3ff}canvas{display:block;width:1080px;height:1920px}</style></head><body><canvas id="frame" width="2160" height="3840"></canvas><script>
'use strict';
// Deterministic original animation, based on the approved revision-05 stills.
const canvas=document.getElementById('frame'),ctx=canvas.getContext('2d');
const font='-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif';
const C={bg:'#edf3ff',paper:'#ffffff',ink:'#203145',muted:'#687c93',blue:'#0071e3'};
const logo=new Image();logo.src='LOGO_IMAGE';
const output=document.createElement('canvas');output.width=1080;output.height=1920;const ox=output.getContext('2d');
const clamp=x=>Math.max(0,Math.min(1,x)),mix=(a,b,u)=>a+(b-a)*u;
const smooth=x=>{x=clamp(x);return x*x*x*(x*(x*6-15)+10)};
const ease=x=>1-Math.pow(1-clamp(x),3);
const phase=(t,a,b)=>clamp((t-a)/(b-a));
const packetScale=0.75, PW=580*packetScale,PH=340*packetScale;
const X0=70,X1=575,Y=960-PH/2;
const T={compress:2,packed:2.24,launch:3,arrival:7,settled:7.45,updateStart:8.1,updateEnd:9.15,found:9.5,payoff:10.8,readable:11.8,signoff:15.3,end:18};
function rr(x,y,w,h,r,fill,stroke=null,lw=2){ctx.beginPath();ctx.roundRect(x,y,Math.max(0,w),Math.max(0,h),Math.min(r,h/2,w/2));if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}}
function line(x1,y1,x2,y2,color,width){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function text(value,x,y,size,weight=500,color=C.ink){ctx.fillStyle=color;ctx.font=`${weight} ${size}px ${font}`;ctx.fillText(value,x,y)}
function alpha(a,fn){if(a<=0)return;ctx.save();ctx.globalAlpha*=clamp(a);fn();ctx.restore()}
function centered(value,y,size,weight=550,color=C.ink){ctx.font=`${weight} ${size}px ${font}`;text(value,(1080-ctx.measureText(value).width)/2,y,size,weight,color)}
function bg(){ctx.setTransform(2,0,0,2,0,0);ctx.globalAlpha=1;ctx.fillStyle=C.bg;ctx.fillRect(0,0,1080,1920)}
function source(t){
 const q=ease(phase(t,0,.38)),sc=1-.030*(1-q),dy=22*(1-q)-1.4*Math.sin(q*Math.PI);
 ctx.save();ctx.translate(540,960+dy);ctx.scale(sc,sc);ctx.translate(-540,-960);
 alpha(.72+.28*q,()=>{rr(110,790,860,340,30,C.paper);text('Microsoft',174,919,48,500,C.muted);text('SWE Internship',174,1016,78,550)});ctx.restore();
}
function compression(t){
 const p=smooth(phase(t,T.compress,T.packed));
 const x=mix(110,X0,p),y=mix(790,Y,p),w=mix(860,PW,p),h=mix(340,PH,p),r=mix(30,25*packetScale,p);
 rr(x,y,w,h,r,C.paper);
 alpha(smooth(phase(p,.22,.88)),()=>{
  rr(x,y,w,h,r,null,C.blue,4*packetScale);
  ctx.save();ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.clip();
  ctx.fillStyle='#e8f2ff';ctx.fillRect(x,y,42*packetScale*p,h);
  ctx.fillStyle=C.blue;ctx.fillRect(x+w-11*packetScale,y+78*packetScale,11*packetScale,h-156*packetScale);ctx.restore();
 });
 // Three text runs keep their source origin, compress, and coalesce into bars.
 ctx.font=`550 78px ${font}`;const internshipX=174+ctx.measureText('SWE ').width;
 const runs=[['Microsoft',174,919,48,500,C.muted,94,89,228,'#305c91'],['SWE ',174,1016,78,550,C.ink,94,157,158,'#8eadd1'],['Internship',internshipX,1016,78,550,C.ink,94,225,263,'#8eadd1']];
 for(const [value,sx,sy,size,weight,color,tx,ty,len,barcolor] of runs){
  const px=mix(sx,x+tx*packetScale,p),py=mix(sy,y+ty*packetScale+4*packetScale,p);
  const syScale=mix(1,.085,p),sxScale=mix(1,.43,p);
  alpha(1-smooth(phase(p,.52,.90)),()=>{ctx.save();ctx.translate(px,py);ctx.scale(sxScale,syScale);text(value,0,0,size,weight,color);ctx.restore()});
  alpha(smooth(phase(p,.50,.94)),()=>line(px,py-4*packetScale,px+len*packetScale,py-4*packetScale,barcolor,15*packetScale));
 }
 alpha(smooth(phase(p,.68,1)),()=>line(x+426*packetScale,y+170*packetScale,x+w-12*packetScale,y+170*packetScale,C.blue,4*packetScale));
}
function packet(x,y,tail=0,opacity=1){alpha(opacity,()=>{
 if(tail>0){
  const ys=[81,169,258],lens=[108,76,132];
  for(let i=0;i<3;i++){
   const a=x-28-tail*lens[i],b=x-(19+i*5),py=y+ys[i]*packetScale;
   const g=ctx.createLinearGradient(a,py,b,py);g.addColorStop(0,'rgba(0,113,227,0)');g.addColorStop(.45,'rgba(65,139,225,.20)');g.addColorStop(1,'rgba(65,139,225,.72)');
   line(a,py,b,py,g,(i===1?3:4));
  }
 }
 rr(x,y,PW,PH,25*packetScale,C.paper,C.blue,4*packetScale);
 ctx.save();ctx.beginPath();ctx.roundRect(x,y,PW,PH,25*packetScale);ctx.clip();ctx.fillStyle='#e8f2ff';ctx.fillRect(x,y,42*packetScale,PH);ctx.fillStyle=C.blue;ctx.fillRect(x+PW-11*packetScale,y+78*packetScale,11*packetScale,PH-156*packetScale);ctx.restore();
 line(x+94*packetScale,y+89*packetScale,x+322*packetScale,y+89*packetScale,'#305c91',15*packetScale);
 line(x+94*packetScale,y+157*packetScale,x+252*packetScale,y+157*packetScale,'#8eadd1',15*packetScale);
 line(x+94*packetScale,y+225*packetScale,x+357*packetScale,y+225*packetScale,'#8eadd1',15*packetScale);
 line(x+426*packetScale,y+170*packetScale,x+PW-12*packetScale,y+170*packetScale,C.blue,4*packetScale);
 if(tail>0){ctx.strokeStyle='#a9c7ee';ctx.lineWidth=3*packetScale;ctx.beginPath();ctx.moveTo(x+PW+27*packetScale,y+105*packetScale);ctx.quadraticCurveTo(x+PW+48*packetScale,y+170*packetScale,x+PW+27*packetScale,y+235*packetScale);ctx.stroke()}
 })}
function flightState(t){const u=phase(t,T.launch,T.arrival);return {u,x:X0+(X1-X0)*(.06*u+.94*u*u*u),velocity:(X1-X0)/4*(.06+2.82*u*u),backgroundSpeed:80+5200*u*u}}
function speedField(t,camera=0,opacity=1){
 const u=phase(t,T.launch,T.arrival),dt=Math.max(0,t-T.launch);
 // Integrated increasing velocity. The field keeps moving through contact.
 const distance=80*dt+5200*(dt<=4?dt*dt*dt/48:4/3+dt-4);
 const rows=[493,612,729,1195,1320,1451,838,1080,381,1560];
 const anchors=[850,370,1030,650,230,900,510,760,390,980];
 alpha(opacity,()=>{for(let i=0;i<rows.length;i++){
  const gate=ease(phase(u,i*.055,i*.055+.14));if(!gate)continue;
  const near=.58+(i%4)*.16,period=1430+(i%3)*220;
  const len=(38+340*u*u)*(.75+(i%3)*.22);
  const head=((anchors[i]-distance*near-camera)%period+period)%period;
  const a=(.32+.40*u*u)*gate;
  for(let j=-1;j<2;j++){
   const x=head+j*period,y=rows[i],g=ctx.createLinearGradient(x-len,y,x,y);
   const rgb=i%3===2?'255,255,255':'91,155,229';
   g.addColorStop(0,`rgba(${rgb},0)`);g.addColorStop(.27,`rgba(${rgb},${a*.65})`);g.addColorStop(.86,`rgba(${rgb},${a})`);g.addColorStop(1,`rgba(${rgb},0)`);
   line(x-len,y,x,y,g,2+(i%3)+2*u*u);
  }
 }});
}
function flight(t){
 const f=flightState(t),enter=ease(phase(t,T.launch,T.launch+.16));
 speedField(t);
 // Short temporal exposures sit behind a completely sharp main silhouette.
 for(let j=3;j>=1;j--)packet(f.x-f.velocity*.008*j,Y,0,.025*(4-j)*enter*f.u);
 packet(f.x,Y,enter*(.20+2.45*f.u*f.u));
 // Blue leading-edge reflection is graphic: a narrow flat highlight, no bevel.
 alpha(.55*enter,()=>line(f.x+PW-2,Y+78*packetScale,f.x+PW-2,Y+262*packetScale,'#72bcff',1.5));
}
function intactLogo(dx=0,opacity=1,reveal=1){alpha(opacity,()=>{ctx.save();ctx.beginPath();ctx.rect(330+dx,715,420*reveal,420);ctx.clip();ctx.drawImage(logo,330+dx,715,420,420);ctx.restore()})}
function handoff(t){
 const q=phase(t,T.arrival,T.settled),travel=smooth(q);
 const offset=638.984375,camera=offset*travel,dx=offset-camera;
 // One world-space handoff. Camera translation affects all objects together.
 // Packet's leading edge reaches x1010 before this short shared camera whip.
 const fade=1-smooth(phase(q,.12,.70)),packetX=X1+flightState(T.arrival).velocity*(t-T.arrival)-camera;
 speedField(t,camera,1-smooth(phase(q,0,.5)));
 packet(packetX,Y,2.65,fade);
 const reveal=ease(phase(q,0,.78)),op=ease(phase(q,.08,.54));
 // A 90ms directional exposure makes the pan continuous; the original mark
 // is always drawn at exactly420x420, with zero stretching or perspective.
 const blur=(1-smooth(phase(q,0,.58)))*20;
 if(blur>.01)for(let j=3;j>=1;j--)intactLogo(dx+blur*j,.015*(4-j)*op,reveal);
 intactLogo(dx,op,reveal);
 const edge=1010-camera,pulse=Math.sin(Math.PI*phase(q,0,.5));
 alpha(pulse*.7,()=>line(edge,896,edge,1024,C.blue,4));
 alpha(pulse*.18,()=>{ctx.strokeStyle=C.blue;ctx.lineWidth=2;ctx.beginPath();ctx.arc(edge,960,18+68*phase(q,0,.5),-.9,.9);ctx.stroke()});
}
function receiver(t){
 intactLogo(0,1-smooth(phase(t,9.25,T.found)));
 if(t<T.updateStart||t>=T.updateEnd)return;
 // Abstract receipt/update motif: no app interface, role count or vacancy claim.
 const arrive=ease(phase(t,T.updateStart,8.4)),leave=smooth(phase(t,8.8,T.updateEnd));
 const x=390-26*(1-arrive),y=1172-25*leave;
 alpha(arrive*(1-leave),()=>{
  rr(x,y,300,98,22,C.paper);
  const ring=phase(t,8.27,8.77);
  alpha((1-ring)*.4,()=>{ctx.strokeStyle=C.blue;ctx.lineWidth=2;ctx.beginPath();ctx.arc(x+40,y+49,10+19*ring,0,Math.PI*2);ctx.stroke()});
  rr(x+33,y+42,14,14,7,C.blue);
  line(x+70,y+36,x+231,y+36,'#305c91',8);
  // A second information bar fills in, then the update motif clears.
  const update=ease(phase(t,8.3,8.65));
  line(x+70,y+62,x+70+137*update,y+62,'#8eadd1',8);
 });
}
function payoff(t){
 const opening=smooth(phase(t,T.found,T.found+.4));
 // The blue information accent carries the reveal after the logo has cleared.
 const foundOut=1-smooth(phase(t,10.55,T.payoff));
 alpha(opening*foundOut,()=>{centered('Found.',1008+14*(1-opening),152,580);});
 const accentIn=smooth(phase(t,T.found,T.found+.4));
 alpha(accentIn,()=>rr(492,829,96,5,2.5,C.blue));
 const a=smooth(phase(t,T.payoff,11.35)),b=smooth(phase(t,11.15,T.readable));
 alpha(a,()=>centered('We handle the finding.',963+18*(1-a),67,550));
 alpha(b,()=>centered('You focus on applying.',1054+18*(1-b),67,550));
}
function signoff(t){
 const out=smooth(phase(t,T.signoff,15.55)),q=smooth(phase(t,15.55,15.9));
 if(out<1){alpha(1-out,()=>{centered('We handle the finding.',963-8*out,67,550);centered('You focus on applying.',1054-8*out,67,550)});}
 alpha(1-q,()=>rr(492,829,96,5,2.5,C.blue));
 alpha(q,()=>centered('JJIntern',1000+10*(1-q),117,580));
}
window.drawScene=function(t){bg();if(t<T.compress)source(t);else if(t<T.packed)compression(t);else if(t<T.launch)packet(X0,Y);else if(t<T.arrival)flight(t);else if(t<T.settled)handoff(t);else if(t<T.found)receiver(t);else if(t<T.signoff)payoff(t);else signoff(t);};
window.framePNG=function(t,width=1080){drawScene(t);if(output.width!==width){output.width=width;output.height=Math.round(width*16/9)}ox.clearRect(0,0,output.width,output.height);ox.drawImage(canvas,0,0,output.width,output.height);return output.toDataURL('image/png').split(',')[1]};
window.ready=Promise.all([logo.decode(),document.fonts.ready]).then(()=>({width:1080,height:1920,duration:18,timeline:T,supersampling:[2160,3840],font,logo:[logo.width,logo.height],packet:{scale:packetScale,startX:X0,endX:X1,width:PW,height:PH,leadingEdgeAtContact:1010},flight:{start:T.launch,end:T.arrival,formula:'x_start+(x_end-x_start)*(0.06*u+0.94*u^3)',cameraTracking:false,backgroundStreaks:{direction:'right-to-left',speed:'80+5200*u^2',length:'38+340*u^2',density:'10 staggered row entrances, integrated motion'}},handoff:'Shared camera translation only after contact; intact original logo',update:'Abstract blue-dot information-bar receipt beneath logo, no text or real app state',source:'Revision07 user pacing correction: fast morph, packet pause, four-second acceleration, quieter logo/update and slower copy. No measured discovery-speed claim.'}));
window.ready.then(()=>drawScene(0));
</script></body></html>
