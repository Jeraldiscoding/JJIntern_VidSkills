function compression(t){

 ctx.font=`550 78px ${font}`;const internshipX=174+ctx.measureText('SWE ').width;
 const runs=[{s:'Microsoft',sx:174,sy:919,size:48,weight:500,color:C.muted,by:66.75,len:171,start:.01,end:.36,ink:'#305c91'},

function speedField(t,opacity=1){

function airFlow(t,f,opacity=1){

 });

function logoPlane(x,y,size=210,backing=true){

function receiverShell(x,y,w,h,open){

   const y=870+i*89,offset=((q*2400+i*290)%1800)-480;

function flight(t){

function routedRibbons(t){

function impactOutline(t){
